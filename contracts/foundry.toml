# Foundry configuration of the contracts. Forge runs in the pinned Foundry image through
# make (make check-contracts), never from the host; see README.md.
[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
# The latest solc with no known bug (docs/bugs_by_version.json of the Solidity repo).
solc = "0.8.39"
# Cancun is what the contracts need (transient storage for the reentrancy guard); a
# newer target could use opcodes the L2 does not have.
evm_version = "cancun"
optimizer = true
optimizer_runs = 10000
# No metadata hash in the bytecode, so the same source always gives the same bytes and
# a deployed contract can be compared with a local build.
bytecode_hash = "none"
cbor_metadata = false
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
]
