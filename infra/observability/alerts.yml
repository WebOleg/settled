# Alert rules. Each rule but the last is an overview tile of the chain dashboard: the
# same query, the same red line, held for a minute so a single slow scrape does not page
# (the vault's and the ledger's, which read exact state, fire at once; see there).
# make obs-check fails if a rule and its tile differ. A client that stops takes its own
# metrics with it, and a query over metrics that are gone returns nothing, so no tile
# turns red; TargetDown covers that. Each rule links its runbook in docs/runbooks.md.
groups:
  - name: chain
    rules:
      - alert: L2BlocksStalled
        expr: max(rate(op_node_default_refs_number{chain="l2",node="sequencer",layer="l2",type="l2_unsafe"}[1m])) * 60 < 25
        for: 1m
        labels:
          severity: page
          tile: L2 makes blocks
        annotations:
          summary: The sequencer makes fewer than 25 L2 blocks a minute.
          runbook: docs/runbooks.md#l2blocksstalled

      - alert: BatchesNotReachingL1
        expr: (max(op_node_default_refs_number{chain="l2",node="sequencer",layer="l2",type="l2_unsafe"}) - max(op_node_default_refs_number{chain="l2",node="sequencer",layer="l2",type="l2_safe"})) * 2 >= 180
        for: 1m
        labels:
          severity: page
          tile: Batches reach the L1
        annotations:
          summary: Three minutes or more of L2 blocks are not yet confirmed by the L1.
          runbook: docs/runbooks.md#batchesnotreachingl1

      - alert: VerifierBehind
        expr: clamp_min(max(op_node_default_refs_number{chain="l2",node="sequencer",layer="l2",type="l2_unsafe"}) - max(op_node_default_refs_number{chain="l2",node="verifier",layer="l2",type="l2_unsafe"}), 0) >= 5
        for: 1m
        labels:
          severity: page
          tile: Verifier keeps up
        annotations:
          summary: The verifier is 5 or more blocks behind the sequencer.
          runbook: docs/runbooks.md#verifierbehind

      - alert: ProposalsStalled
        expr: time() - max(op_proposer_default_txmgr_last_confirm_unix{chain="l2"}) >= 900
        for: 1m
        labels:
          severity: page
          tile: Proposals are made
        annotations:
          summary: The proposer has not posted a state to the L1 for 15 minutes.
          runbook: docs/runbooks.md#proposalsstalled

      - alert: L1FinalityStalled
        expr: max(chain_head_block{chain="l1"}) - max(chain_head_finalized{chain="l1"}) >= 160
        for: 1m
        labels:
          severity: page
          tile: L1 finalizes
        annotations:
          summary: The L1 finalized block is 160 or more blocks behind its head.
          runbook: docs/runbooks.md#l1finalitystalled

      - alert: OperatorFundsLow
        expr: min(op_batcher_default_balance{chain="l2"} or op_proposer_default_balance{chain="l2"}) < 1
        for: 1m
        labels:
          severity: page
          tile: Operators have funds
        annotations:
          summary: The batcher or the proposer holds less than 1 ETH on the L1.
          runbook: docs/runbooks.md#operatorfundslow

      # The vault. These read the chain's state exactly, not a rate, so one reading is
      # enough: each fires at once. A queued withdrawal must be checked within the queue
      # delay, and a pause or a shortfall must be seen the moment it happens.
      - alert: VaultInsolvent
        expr: min(vault_solvent{chain="l2"}) < 1
        for: 0s
        labels:
          severity: page
          tile: Vault holds what it owes
        annotations:
          summary: The vault holds less ETH than its deposits account for.
          runbook: docs/runbooks.md#vaultinsolvent

      - alert: VaultWithdrawalQueued
        expr: max(vault_queued_withdrawals{chain="l2"}) >= 1
        for: 0s
        labels:
          severity: page
          tile: Vault queue is empty
        annotations:
          summary: A large withdrawal waits in the vault's queue; check it against the ledger before its release block.
          runbook: docs/runbooks.md#vaultwithdrawalqueued

      - alert: VaultPaused
        expr: max(vault_paused{chain="l2"}) >= 1
        for: 0s
        labels:
          severity: page
          tile: Vault is open
        annotations:
          summary: The guardian has paused the vault; deposits and payments stop.
          runbook: docs/runbooks.md#vaultpaused

      - alert: VaultWatchStale
        expr: time() - max(vault_watch_last_success_timestamp_seconds{chain="l2"}) >= 60
        for: 1m
        labels:
          severity: page
          tile: Vault is watched
        annotations:
          summary: The vault exporter has not read the chain for a minute; the vault alerts above see an old state.
          runbook: docs/runbooks.md#vaultwatchstale

      - alert: DepositIndexerStale
        expr: time() - max(deposit_indexer_last_step_timestamp_seconds{chain="l2"}) >= 60
        for: 1m
        labels:
          severity: page
          tile: Deposits are indexed
        annotations:
          summary: The deposit indexer has not completed a step for a minute; no deposit is held, credited or voided.
          runbook: docs/runbooks.md#depositindexerstale

      - alert: DepositIndexerBehind
        expr: max(deposit_indexer_lag_blocks{chain="l2"}) >= 30
        for: 1m
        labels:
          severity: page
          tile: Indexer keeps up
        annotations:
          summary: The deposit indexer is 30 or more blocks behind the node's head; new deposits are not yet held.
          runbook: docs/runbooks.md#depositindexerbehind

      - alert: DepositFinalityViolation
        expr: max(deposit_indexer_finality_violation{chain="l2"}) >= 1
        for: 0s
        labels:
          severity: page
          tile: Finality holds
        annotations:
          summary: A block the indexer held final has left the chain; deposits were credited on a chain that is gone, and the indexer has stopped.
          runbook: docs/runbooks.md#depositfinalityviolation

      - alert: LedgerOutOfBalance
        expr: max(ledger_check_problems{chain="l2"}) >= 1
        for: 0s
        labels:
          severity: page
          tile: Ledger balances
        annotations:
          summary: A balance in the ledger differs from the sum of its transfers, or debits differ from credits.
          runbook: docs/runbooks.md#ledgeroutofbalance

      - alert: WithdrawalPayerStale
        expr: time() - max(withdrawal_payer_last_step_timestamp_seconds{chain="l2"}) >= 60
        for: 1m
        labels:
          severity: page
          tile: Payer is running
        annotations:
          summary: The withdrawal payer has not completed a step for a minute; no withdrawal is paid, sent again or replaced.
          runbook: docs/runbooks.md#withdrawalpayerstale

      - alert: WithdrawalsWaiting
        expr: max(withdrawal_payer_oldest_requested_seconds{chain="l2"}) >= 600
        for: 1m
        labels:
          severity: page
          tile: Withdrawals are paid
        annotations:
          summary: A withdrawal has waited 10 minutes or more with nothing on chain for it; the payer runs but cannot pay it.
          runbook: docs/runbooks.md#withdrawalswaiting

      - alert: PayerFundsLow
        expr: min(withdrawal_payer_balance_wei{chain="l2"}) / 1e18 < 0.01
        for: 1m
        labels:
          severity: page
          tile: Payer has gas
        annotations:
          summary: The withdrawal payer's key holds less than 0.01 ETH for gas on the L2; it will soon sign nothing that is mined.
          runbook: docs/runbooks.md#payerfundslow

      - alert: SuspenseUnresolved
        expr: max(ledger_suspense_oldest_seconds{chain="l2"}) >= 86400
        for: 0s
        labels:
          severity: ticket
          tile: Suspense explained
        annotations:
          summary: A payment that left the vault without the ledger has waited in suspense a day or more without an approved explanation.
          runbook: docs/runbooks.md#suspenseunresolved

      - alert: TargetDown
        expr: up == 0
        for: 1m
        labels:
          severity: page
        annotations:
          summary: A client of the devnet does not answer Prometheus.
          runbook: docs/runbooks.md#targetdown
