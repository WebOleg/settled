# Observability for the devnet. Prometheus scrapes every client of the L1 and the L2
# over their Docker networks, and the vault exporter, and evaluates the alert rules;
# Alertmanager receives the alerts; Grafana shows the dashboards in this repository. The
# metrics ports are not published; Prometheus, Alertmanager and Grafana are, on
# 127.0.0.1 only. Images are pinned by digest, the exporter's base images too.
name: settled-obs

networks:
  default: {}
  l1:
    name: settled-l1_default
    external: true
  l2:
    name: settled-l2_default
    external: true

volumes:
  prometheus: {}
  alertmanager: {}
  grafana: {}

services:
  prometheus:
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    restart: unless-stopped
    networks:
      - default
      - l1
      - l2
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.listen-address=0.0.0.0:9090
    ports:
      - 127.0.0.1:9090:9090
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus:/prometheus

  # Watches the vault on the L2 from the verifier node and serves what it sees as
  # metrics (cmd/vault-exporter). Built from this repository. It reads the deployment
  # record from its own folder, mounted read-only, so it never sees the vault's keys;
  # the folder, not the file, is mounted, so a record replaced by a rename is seen.
  vault-exporter:
    build:
      context: ../..
      dockerfile: infra/images/vault-exporter/Dockerfile
    restart: unless-stopped
    networks:
      - default
      - l2
    command:
      - -rpc=http://verifier-op-reth:8545
      - -record=/vault/deployment.json
      - -listen=:9100
    volumes:
      - ../../.devnet/vault/record:/vault:ro

  alertmanager:
    image: prom/alertmanager:v0.35.1@sha256:4e3d029e69c7f61dd53a2b31a3dc427a2b81736cffca185c0854075e07969e36
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=0.0.0.0:9093
    ports:
      - 127.0.0.1:9093:9093
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager:/alertmanager

  grafana:
    image: grafana/grafana:13.3.2@sha256:81556409ba48b2b922e0adb69a2511337d8ba7578f11962eefa6149a2d815101
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      # Anyone on this machine may look; nobody may change anything in the UI. Dashboards
      # and the data source come from files in this repository.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      # The admin password is read from a file written once by obs-init.sh; it is not in
      # this file, an env file or docker inspect.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/chain.json
    secrets:
      - grafana_admin
    ports:
      - 127.0.0.1:3000:3000
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana

secrets:
  grafana_admin:
    file: ../../.devnet/observability/grafana-admin.txt
