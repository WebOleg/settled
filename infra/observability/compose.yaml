# Observability for the devnet. Prometheus scrapes every client of the L1 and the L2
# over their Docker networks; the metrics ports are not published, only Prometheus is,
# on 127.0.0.1. Images are pinned by digest.
name: settled-obs

networks:
  l1:
    name: settled-l1_default
    external: true
  l2:
    name: settled-l2_default
    external: true

volumes:
  prometheus: {}

services:
  prometheus:
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    restart: unless-stopped
    networks:
      - l1
      - l2
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.listen-address=0.0.0.0:9090
    ports:
      - 127.0.0.1:9090:9090
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus
