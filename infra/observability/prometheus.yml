# Every client of the devnet, scraped every 5 s: the L2 makes a block every 2 s and the
# L1 a slot every 6 s, so a 15 s default would hide most of what happens. Each target
# carries the chain it belongs to (l1, l2), its role and, where there are two, the node,
# which dashboards and alerts group by. The label is called chain, not layer: op-node
# has its own layer label, which a target label of that name would rename away.
global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 5s

# Alert rules, one per overview tile of the dashboard, and Alertmanager to receive them.
rule_files:
  - alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: geth
    metrics_path: /debug/metrics/prometheus
    static_configs:
      - targets: [geth:6060]
        labels: {chain: l1, role: execution}

  - job_name: lighthouse-beacon
    static_configs:
      - targets: [beacon:5054]
        labels: {chain: l1, role: consensus}

  - job_name: lighthouse-validator
    static_configs:
      - targets: [validator:5064]
        labels: {chain: l1, role: validator}

  - job_name: op-reth
    static_configs:
      - targets: [op-reth:9001]
        labels: {chain: l2, role: execution, node: sequencer}
      - targets: [verifier-op-reth:9001]
        labels: {chain: l2, role: execution, node: verifier}

  - job_name: op-node
    static_configs:
      - targets: [op-node:7300]
        labels: {chain: l2, role: rollup, node: sequencer}
      - targets: [verifier-op-node:7300]
        labels: {chain: l2, role: rollup, node: verifier}

  - job_name: op-batcher
    static_configs:
      - targets: [op-batcher:7300]
        labels: {chain: l2, role: batcher}

  - job_name: op-proposer
    static_configs:
      - targets: [op-proposer:7300]
        labels: {chain: l2, role: proposer}

  # The vault, as the verifier node sees it (cmd/vault-exporter).
  - job_name: vault-exporter
    static_configs:
      - targets: [vault-exporter:9100]
        labels: {chain: l2, role: vault}
