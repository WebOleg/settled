# Devnet L2. Sequencer: op-reth (execution), op-node (rollup node, sequencing) and
# op-batcher (posts the L2 blocks to the L1 as blobs). Verifier: a second op-reth and
# op-node that build the chain from the L1 and receive new blocks from the sequencer
# over peer-to-peer. op-proposer posts the verifier's view of the chain to the L1 as
# dispute games. Reads the chain config written by make l2-deploy; the rollup nodes
# and the batcher join the L1 network to reach geth and the beacon node. Ports are bound
# to 127.0.0.1 only; engine APIs and peer-to-peer ports are not published at all. Images
# are pinned by digest.
name: settled-l2

x-deployer: &deployer ../../../.devnet/l2/deployer:/deployer:ro
x-l1-chain: &l1chain ../../../.devnet/l2/sequencer/l1-chain-config.json:/l1/chain-config.json:ro
x-jwt: &jwt ../../../.devnet/l2/sequencer/jwt.hex:/secrets/jwt.hex:ro
x-verifier-jwt: &verifierjwt ../../../.devnet/l2/verifier/jwt.hex:/secrets/jwt.hex:ro

# Role keys reach a container only as secret files, each to the one container that uses
# it, never through this file, an env file or a command line.
secrets:
  batcher_key:
    file: ../../../.devnet/l2/keys/batcher.key
  sequencer_key:
    file: ../../../.devnet/l2/keys/sequencer.key
  proposer_key:
    file: ../../../.devnet/l2/keys/proposer.key

networks:
  default: {}
  l1:
    name: settled-l1_default
    external: true

services:
  op-reth:
    image: us-docker.pkg.dev/oplabs-tools-artifacts/images/op-reth:v2.10.0@sha256:885007dce21382f44269734c7b02f065c8cbc12c7b18c3aeb35e1e93cc045997
    restart: unless-stopped
    command:
      - node
      - --chain=/deployer/genesis.json
      - --datadir=/data
      - --http
      - --http.addr=0.0.0.0
      - --http.port=8545
      # miner: the batcher calls miner_setMaxDASize to throttle block data when posting
      # falls behind.
      - --http.api=eth,net,web3,txpool,debug,miner
      - --ws
      - --ws.addr=0.0.0.0
      - --ws.port=8546
      - --ws.api=eth,net,web3
      - --authrpc.addr=0.0.0.0
      - --authrpc.port=8551
      - --authrpc.jwtsecret=/secrets/jwt.hex
      - --max-outbound-peers=0
      - --max-inbound-peers=0
    ports:
      - 127.0.0.1:18545:8545
      - 127.0.0.1:18546:8546
    volumes:
      - *deployer
      - *jwt
      - ../../../.devnet/l2/sequencer/op-reth:/data

  op-node:
    image: us-docker.pkg.dev/oplabs-tools-artifacts/images/op-node:v1.21.0@sha256:edd773e1351823b8ec950b59c5382b11d4032d3f8503dfc11caa5f23924e3b84
    restart: unless-stopped
    depends_on:
      - op-reth
    networks:
      - default
      - l1
    secrets:
      - sequencer_key
    # The sequencer key signs every new block before it is gossiped; the verifier accepts
    # only blocks signed by the unsafeBlockSigner set in SystemConfig. Read from the
    # secret file, so it is not in docker inspect or in the process arguments.
    entrypoint:
      - /bin/sh
      - -c
      - set -eu; OP_NODE_P2P_SEQUENCER_KEY="$$(cat /run/secrets/sequencer_key)"; export OP_NODE_P2P_SEQUENCER_KEY; exec op-node "$$@"
      - op-node
    command:
      - --l1=http://geth:8545
      - --l1.beacon=http://beacon:4000
      - --l2=http://op-reth:8551
      - --l2.jwt-secret=/secrets/jwt.hex
      - --rollup.config=/deployer/rollup.json
      # The local L1 is unknown to op-node; without its chain config op-node cannot know
      # the L1 forks and blob parameters. It takes the chain config object only, not the
      # whole genesis file (l2-init.sh extracts it).
      - --rollup.l1-chain-config=/l1/chain-config.json
      - --sequencer.enabled
      - --safedb.path=/data/safedb
      # Peer-to-peer inside the Docker network only: a fixed node key, no discovery; the
      # verifier dials this node as a static peer.
      - --p2p.listen.ip=0.0.0.0
      - --p2p.listen.tcp=9222
      - --p2p.no-discovery
      - --p2p.priv.path=/p2p/node.key
      - --p2p.peerstore.path=/data/peerstore
      - --p2p.discovery.path=/data/discovery
      - --rpc.addr=0.0.0.0
      - --rpc.port=9545
    ports:
      - 127.0.0.1:19545:9545
    volumes:
      - *deployer
      - *l1chain
      - *jwt
      - ../../../.devnet/l2/sequencer/p2p.key:/p2p/node.key:ro
      - ../../../.devnet/l2/sequencer/op-node:/data

  op-batcher:
    image: us-docker.pkg.dev/oplabs-tools-artifacts/images/op-batcher:v1.19.0@sha256:1d866b68302d3e071a8c4b1c35d0055ac8f44606d07c032d021d102523cc1462
    restart: unless-stopped
    depends_on:
      - op-node
    networks:
      - default
      - l1
    secrets:
      - batcher_key
    # Reads the key from the secret file into the environment of op-batcher only, so it
    # is not in docker inspect or in the process arguments.
    entrypoint:
      - /bin/sh
      - -c
      - set -eu; OP_BATCHER_PRIVATE_KEY="$$(cat /run/secrets/batcher_key)"; export OP_BATCHER_PRIVATE_KEY; exec op-batcher "$$@"
      - op-batcher
    command:
      - --l1-eth-rpc=http://geth:8545
      - --l2-eth-rpc=http://op-reth:8545
      - --rollup-rpc=http://op-node:9545
      - --data-availability-type=blobs
      - --batch-type=1
      - --compression-algo=brotli-10
      # Differs from production: close a channel after 5 L1 blocks (30 s) so the safe
      # head moves within a minute on an idle chain. 0, the default, waits for a full
      # channel or the end of the sequencing window.
      - --max-channel-duration=5
      - --num-confirmations=4
      - --wait-node-sync

  verifier-op-reth:
    image: us-docker.pkg.dev/oplabs-tools-artifacts/images/op-reth:v2.10.0@sha256:885007dce21382f44269734c7b02f065c8cbc12c7b18c3aeb35e1e93cc045997
    restart: unless-stopped
    command:
      - node
      - --chain=/deployer/genesis.json
      - --datadir=/data
      - --http
      - --http.addr=0.0.0.0
      - --http.port=8545
      - --http.api=eth,net,web3,txpool
      - --ws
      - --ws.addr=0.0.0.0
      - --ws.port=8546
      - --ws.api=eth,net,web3
      - --authrpc.addr=0.0.0.0
      - --authrpc.port=8551
      - --authrpc.jwtsecret=/secrets/jwt.hex
      - --max-outbound-peers=0
      - --max-inbound-peers=0
      # Transactions sent to this node are forwarded to the sequencer, the only node
      # that builds blocks.
      - --rollup.sequencer=http://op-reth:8545
      # Proofs of past blocks (eth_getProof) up to one week of 2 s blocks back, so every
      # proposal and every withdrawal can be checked against the block it names.
      - --rpc.eth-proof-window=302400
    ports:
      - 127.0.0.1:28545:8545
      - 127.0.0.1:28546:8546
    volumes:
      - *deployer
      - *verifierjwt
      - ../../../.devnet/l2/verifier/op-reth:/data

  verifier-op-node:
    image: us-docker.pkg.dev/oplabs-tools-artifacts/images/op-node:v1.21.0@sha256:edd773e1351823b8ec950b59c5382b11d4032d3f8503dfc11caa5f23924e3b84
    restart: unless-stopped
    depends_on:
      - verifier-op-reth
      - op-node
    networks:
      - default
      - l1
    # OP_NODE_P2P_STATIC: the sequencer's address with its peer ID, written by
    # l2-init.sh from the sequencer's node key. Not a secret.
    env_file:
      - ../../../.devnet/l2/verifier/p2p.env
    command:
      - op-node
      - --l1=http://geth:8545
      - --l1.beacon=http://beacon:4000
      - --l2=http://verifier-op-reth:8551
      - --l2.jwt-secret=/secrets/jwt.hex
      - --rollup.config=/deployer/rollup.json
      - --rollup.l1-chain-config=/l1/chain-config.json
      # Every block comes from deriving the L1 through this op-node; the execution
      # client does not sync state from peers.
      - --syncmode=consensus-layer
      - --safedb.path=/data/safedb
      - --p2p.listen.ip=0.0.0.0
      - --p2p.listen.tcp=9222
      - --p2p.no-discovery
      - --p2p.priv.path=/p2p/node.key
      - --p2p.peerstore.path=/data/peerstore
      - --p2p.discovery.path=/data/discovery
      - --rpc.addr=0.0.0.0
      - --rpc.port=9545
    ports:
      - 127.0.0.1:29545:9545
    volumes:
      - *deployer
      - *l1chain
      - *verifierjwt
      - ../../../.devnet/l2/verifier/p2p.key:/p2p/node.key:ro
      - ../../../.devnet/l2/verifier/op-node:/data

  op-proposer:
    image: us-docker.pkg.dev/oplabs-tools-artifacts/images/op-proposer:v1.17.1@sha256:4e5c88fefd52a31961a09cd4bbb8883a1afcdd875ee651ab664a5268bd0c05e6
    restart: unless-stopped
    depends_on:
      - verifier-op-node
    networks:
      - default
      - l1
    secrets:
      - proposer_key
    # OP_PROPOSER_GAME_FACTORY_ADDRESS: the DisputeGameFactory of this deployment, written
    # by l2-init.sh from l1-addresses.json. Not a secret.
    env_file:
      - ../../../.devnet/l2/proposer/proposer.env
    entrypoint:
      - /bin/sh
      - -c
      - set -eu; OP_PROPOSER_PRIVATE_KEY="$$(cat /run/secrets/proposer_key)"; export OP_PROPOSER_PRIVATE_KEY; exec op-proposer "$$@"
      - op-proposer
    command:
      - --l1-eth-rpc=http://geth:8545
      # Game type 5 commits to super roots. The proposer reads them from the verifier,
      # which derives the chain from the L1, not from the sequencer that built it.
      - --superroot-rpcs=http://verifier-op-node:9545
      - --game-type=5
      # Differs from production, where a proposal is made about once an hour.
      - --proposal-interval=60s
      - --num-confirmations=4
