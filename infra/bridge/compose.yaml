# The bridge service of the devnet: the ledger's PostgreSQL, the deposit indexer
# (docs/design/deposits.md), the withdrawal payer (docs/design/withdrawals.md) and the
# withdrawal signer that signs for it (docs/design/signer.md), with the payer's key in
# kms-dev, the devnet's KMS (docs/design/kms-dev.md).
# PostgreSQL is published on 127.0.0.1 only, for ledger-migrate and the checks, and
# kms-dev's API for its admin (make vault-payer); the services' metrics ports are not
# published.
# Passwords are read from files in .devnet/bridge that bridge-init.sh writes once; they
# are not in this file, an env file or docker inspect. Images are pinned by digest,
# the indexer's base images too. scripts/lib/postgres.sh takes the PostgreSQL image for
# the checks from this file, so tests and devnet run the same one.
name: settled-bridge

networks:
  default: {}
  l2:
    name: settled-l2_default
    external: true

volumes:
  ledger: {}
  # The keys of kms-dev, for it alone.
  kms-keys: {}

services:
  postgres:
    image: postgres:18.7-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_DB: ledger
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin
    secrets:
      - postgres_admin
    ports:
      - 127.0.0.1:15432:5432
    # PostgreSQL 18 images keep the data in a folder per major version under this path.
    volumes:
      - ledger:/var/lib/postgresql
    healthcheck:
      test: [CMD, pg_isready, -q, -h, 127.0.0.1, -U, admin, -d, ledger]
      interval: 2s
      timeout: 3s
      retries: 30

  # Keeps the ledger in step with the vault's deposits (cmd/deposit-indexer): reads the
  # chain from the verifier node, finds the vault in the deployment record, mounted
  # read-only without the keys, and connects as a login that holds only
  # deposit_indexer.
  deposit-indexer:
    build:
      context: ../..
      dockerfile: infra/images/deposit-indexer/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - l2
    secrets:
      - indexer_db
    command:
      - -rpc=http://verifier-op-reth:8545
      - -record=/vault/deployment.json
      - -db=postgres://indexer@postgres:5432/ledger?sslmode=disable
      - -db-password-file=/run/secrets/indexer_db
      - -listen=:9110
    volumes:
      - ../../.devnet/vault/record:/vault:ro

  # Pays the ledger's withdrawals from the vault (cmd/withdrawal-payer): sends to the
  # sequencer, finds the vault in the deployment record, mounted read-only without the
  # keys, and connects as a login that holds only withdrawal_payer. It holds no key: the
  # signer signs for it, reached over TLS with its client certificate.
  withdrawal-payer:
    build:
      context: ../..
      dockerfile: infra/images/withdrawal-payer/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - l2
    secrets:
      - payer_db
      - {source: tls_ca, target: ca.pem}
      - {source: payer_cert, target: payer.pem}
      - {source: payer_tls_key, target: payer-key.pem}
    command:
      - -rpc=http://op-reth:8545
      - -record=/vault/deployment.json
      - -db=postgres://payer@postgres:5432/ledger?sslmode=disable
      - -db-password-file=/run/secrets/payer_db
      - -signer=https://withdrawal-signer:9443
      - -tls=/run/secrets
      - -listen=:9111
    volumes:
      - ../../.devnet/vault/record:/vault:ro

  # The devnet's KMS (cmd/kms-dev): the part of the AWS KMS API the signer uses. The
  # payer's key is made in it (make vault-payer) and never leaves it. Three principals
  # reach it, each with an access key of its own: the admin, which makes and names keys;
  # the signer, which may only read the public key of alias/payer and sign with it; and
  # key rotation, which may do the same only with alias/payer-retiring, to move a
  # replaced key's funds to the new one. Its keys are in a volume of its own.
  kms-dev:
    build:
      context: ../..
      dockerfile: infra/images/kms-dev/Dockerfile
    restart: unless-stopped
    secrets:
      - kms_admin
      - kms_signer
      - kms_rotation
    command:
      - -listen=:4599
      - -metrics=:9113
      - -dir=/data
      - -admin-credentials=/run/secrets/kms_admin
      - -signer-credentials=/run/secrets/kms_signer
      - -rotation-credentials=/run/secrets/kms_rotation
    ports:
      - 127.0.0.1:14599:4599
    volumes:
      - kms-keys:/data

  # Signs for the payer only what its policy and the ledger allow
  # (cmd/withdrawal-signer), with the payer's key in kms-dev, which has the vault's
  # operator role and nothing else (cmd/vault-payer), and records each decision in the
  # ledger. It signs only as the payer the deployment record names. It reaches no node
  # and is on the bridge's network only; its API needs a client certificate from its CA.
  # It connects as a login that holds only withdrawal_signer.
  withdrawal-signer:
    build:
      context: ../..
      dockerfile: infra/images/withdrawal-signer/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kms-dev:
        condition: service_started
    secrets:
      - signer_db
      - kms_signer
      - {source: tls_ca, target: ca.pem}
      - {source: signer_cert, target: signer.pem}
      - {source: signer_tls_key, target: signer-key.pem}
    command:
      - -record=/vault/deployment.json
      - -db=postgres://signer@postgres:5432/ledger?sslmode=disable
      - -db-password-file=/run/secrets/signer_db
      - -kms-endpoint=http://kms-dev:4599
      - -kms-key=alias/payer
      - -kms-credentials=/run/secrets/kms_signer
      - -tls=/run/secrets
      - -listen=:9443
      - -metrics=:9112
    volumes:
      - ../../.devnet/vault/record:/vault:ro

secrets:
  postgres_admin:
    file: ../../.devnet/bridge/postgres-admin.txt
  indexer_db:
    file: ../../.devnet/bridge/indexer.txt
  payer_db:
    file: ../../.devnet/bridge/payer.txt
  signer_db:
    file: ../../.devnet/bridge/signer.txt
  kms_admin:
    file: ../../.devnet/bridge/kms-admin.txt
  kms_signer:
    file: ../../.devnet/bridge/kms-signer.txt
  kms_rotation:
    file: ../../.devnet/bridge/kms-rotation.txt
  tls_ca:
    file: ../../.devnet/bridge/tls/ca.pem
  payer_cert:
    file: ../../.devnet/bridge/tls/payer.pem
  payer_tls_key:
    file: ../../.devnet/bridge/tls/payer-key.pem
  signer_cert:
    file: ../../.devnet/bridge/tls/signer.pem
  signer_tls_key:
    file: ../../.devnet/bridge/tls/signer-key.pem
