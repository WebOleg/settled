# Runs make check, the same checks a commit must pass locally, on every push to main and
# every pull request. Actions are pinned by commit SHA, since a tag can be moved; the
# token can only read the repository; no secrets are used.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans every commit, not only the last one.
          fetch-depth: 0
          persist-credentials: false
          # The contract libraries, pinned by commit (contracts/lib).
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: 1.26.2
          cache-dependency-path: go.sum

      - name: Install pinned shellcheck and gitleaks
        run: |
          scripts/ci/install-tools.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: make check
        run: make check
        env:
          # Deeper fuzz and invariant runs than a local check (contracts/foundry.toml).
          FOUNDRY_PROFILE: ci
